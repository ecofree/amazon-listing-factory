name: Production Readiness (offline)

on:
  push:
    branches:
      - codex/model-native-image-refactor
  pull_request:
    branches:
      - codex/model-native-image-refactor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-engineering-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline Production Readiness gates
        id: readiness
        run: python -B -X utf8 scripts/run_readiness_checks.py --report test_runs/production_readiness_offline_report.json

      - name: Upload offline test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.sha }}
          path: test_runs/production_readiness_offline_report.json
          if-no-files-found: warn
          retention-days: 30

  windows-process-and-ledger:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run isolated Windows process and ledger gates
        run: python -B -X utf8 scripts/run_readiness_checks.py --targeted-only --report test_runs/windows_readiness_report.json

      - name: Upload Windows offline test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-windows-${{ github.sha }}
          path: test_runs/windows_readiness_report.json
          if-no-files-found: warn
          retention-days: 30
