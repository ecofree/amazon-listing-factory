category_id: bed_frame
display_name: Bed Frame
product_type: BED_FRAME
archetype: furniture
lifecycle: production_ready
amazon_category: Furniture > Bedroom Furniture > Beds, Frames & Bases
browse_node_id: "3734891"

search_terms:
  categories: [bed]
  backend_synonyms: [bed base, bed foundation, mattress frame, bedroom furniture, bed support]
  excluded_tokens: [dog, cat, pet, sofa, air, flower]
  unsupported_tokens: []
  identity_tokens: [twin, full, queen, king, california]
  preserve_tokens: [bunk, loft]
  excluded_all_tokens: []

template:
  allowed_item_type_hints: ["> Bed Frames (bed-frames)"]
  engine: template_field_plan
  path_env: AMAZON_BED_FRAME_TEMPLATE
  default_path: templates/BED_FRAME.xlsm

variation_themes:
  - COLOR/SIZE
  - COLOR
  - SIZE

variation_dimensions:
  - color
  - size

extractors:
  product_specific_fields:
    height: [Height, Item Height, Product Height]
    style:
      - Style
      - Style Name
    size:
      - Size
    special_feature:
      - Special Feature
      - Special Features
      - Additional Features
    color:
      - Color
      - Colour
    material:
      - Material
      - Material Type
    frame_material:
      - Frame Material
      - Frame Material Type
    item_weight:
      - Item Weight
      - Product Weight
    clearance:
      - Ground To Item Distance
      - Under Bed Clearance
      - Clearance
    max_weight:
      - Maximum Weight Recommendation
      - Weight Capacity
      - Maximum Weight Capacity
      - Weight Capacity Maximum
    model_number:
      - Model Number
      - Item model number
      - Model
    dimensions:
      - Item Dimensions L x W x H
      - Product Dimensions
      - Item Dimensions
      - Dimensions
  aliases:
    weight_capacity: max_weight
    weight_capacity_unit: max_weight_unit

category_match:
  require_positive_match: true
  positive_keywords:
    - bed frame
    - platform bed
    - bunk bed
    - loft bed
    - daybed
    - headboard
    - footboard
    - bed with headboard
    - mattress foundation
    - slat
    - guardrail
  negative_keywords:
    - artificial tree
    - artificial plant
    - faux tree
    - faux plant
    - fake plant
    - wisteria
    - topiary
    - ficus
    - olive tree
    - palm tree
    - snake plant
    - bathroom cabinet
    - medicine cabinet
    - mirrored cabinet

model_preferences:
  text_copy:
    model: deepseek-v4-flash

required_role_policy:
  counts:
    main: 1
    scene: 1
    size: 1
    func: 1

image_generation:
  statement_measurements:
    height:
      subject: product
      axis: height
      label: Declared frame height
      source_fields: [Height, Item Height, Product Height]
      tuple_fields: [Item Dimensions D x W x H, Item Dimensions L x W x H, Product Dimensions, Item Dimensions]
  planning_guidance:
    - "Use source-supported bed subtype and audience. A fixed side opening is not a hinged gate or permission to add a foot-end entrance; do not infer a child's age or Montessori use from color."
    - "When visible, retain the whole bed's roof, chimney, caps and supports even when a function view discusses slats. Keep partial slat views partial; a whole-bed count does not fill cropped views."
    - "Bind pine frame, plywood slats and material samples to their own source facts/views. Mattress size, recommended thickness, frame dimensions and per-bunk load are different properties."
  main_image_policy: product_first_lifestyle
  template_image_role_order: [main, scene, func, size]
  structure_invariants:
    - headboard and footboard geometry
    - side rails, slats, platform, and center supports
    - legs and under-bed clearance
    - guardrails, ladder, or stairs when present
    - trundle, drawers, or shelves when present
  allowed_internal_props: []
  replaceable_staging:
    - target_id: room.wall
      physical_scope: Non-sold room wall surfaces
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: room.floor
      physical_scope: Non-sold room floor or rug surfaces
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: bedding.mattress
      physical_scope: A separate mattress not sold with the bed frame
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: bedding.textiles
      physical_scope: Non-sold sheets, blankets, pillows and cushions
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: decor.loose_props
      physical_scope: Independent non-sold wall decor, toys and loose room props
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
  forbidden_additions: []
  visual_context:
    primary_setting: contemporary US bedroom suited to the actual bed type
    buyer: household furnishing the evidenced product type and bed size
    user: infer intended occupant from child product facts, not the category alone
    required_cues:
      - believable room scale, accessible storage and circulation
      - child-scale reading or play cues when the product is a children's bed
    allowed_alternates:
      - guest room or shared bedroom when compatible with product facts
    avoid:
      - unsupported nursery, Montessori or age-suitability assumptions
  role_visual_direction:
    main:
      - Present the complete bed frame in normal use with a mattress and designed bedding, in a bright contemporary US bedroom suited to the actual audience; keep the frame recognizable and do not imply bedding is included. Main remains product-first lifestyle.
    scene:
      - Design a distinct believable room composition and lifestyle moment for the evidenced audience.
    func:
      - Use a photo-led editorial feature composition with the bed frame as the hero and the title in genuine open image space; use sparse annotations, not stacked cards or dashboard grids.
      - Retain the evidenced bed-frame feature and its physical construction within the newly planned presentation.
  role_specific_rules:
    main:
      - Keep the complete bed frame clearly recognizable in a restrained lifestyle room
    scene:
      - Show room scale and intended audience through suitable staging and a supported product viewpoint
    size:
      - Preserve confirmed frame dimensions and dimension endpoints
    func:
      - Show only source-supported storage, support, clearance, or safety features
