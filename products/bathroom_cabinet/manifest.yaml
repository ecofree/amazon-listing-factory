category_id: bathroom_cabinet
display_name: Bathroom Cabinet
product_type: BATHROOM_CABINET
archetype: storage
lifecycle: production_ready
amazon_category: Home & Kitchen > Bath > Bathroom Furniture > Bathroom Cabinets
browse_node_id: ""

search_terms:
  categories: [cabinet]
  backend_synonyms: [bathroom storage, bathroom organizer]
  excluded_tokens: [hinge, knob, paint]
  unsupported_tokens: [medicine, mirror, mirrored, recessed, lighting, light]
  identity_tokens: []
  preserve_tokens: []
  excluded_all_tokens: []

template:
  allowed_item_type_hints: ["Storage Cabinets (cabinets)"]
  engine: template_field_plan
  path_env: AMAZON_BATHROOM_CABINET_TEMPLATE
  default_path: templates/CABINET.xlsm
  product_type: CABINET

variation_themes:
  - COLOR
  - SIZE
  - COLOR/SIZE
  - STYLE_NAME

variation_dimensions:
  - color
  - size
  - style

extractors:
  product_specific_fields:
    material:
      - Material
      - Material Type
    top_material:
      - Top Material Type
      - Top Material
      - Tabletop Material
    frame_material:
      - Frame Material Type
      - Frame Material
    wood_type:
      - Wood Type
    color:
      - Color
      - Colour
      - Finish Color
    finish_type:
      - Finish Type
      - Finish Types
      - Finish
    mounting_type:
      - Mounting Type
      - Installation Type
    item_depth:
      - Item Depth
      - Product Depth
    dimensions:
      - Product Dimensions
      - Item Dimensions
      - Item Dimensions L x W x H
    number_of_doors:
      - Number of Doors
      - Door Count
    number_of_drawers:
      - Number of Drawers
      - Drawer Count
    number_of_shelves:
      - Number of Shelves
      - Shelf Count
    load_capacity:
      - Maximum Weight Recommendation
      - Weight Capacity
      - Weight Capacity Maximum
      - Load Capacity
    item_weight:
      - Item Weight
      - Product Weight
    room_type:
      - Room Type
      - Recommended Uses For Product

category_match:
  require_positive_match: true
  positive_keywords:
    - bathroom cabinet
    - bathroom storage cabinet
    - over toilet storage
    - over-the-toilet
    - bathroom floor storage cabinet
    - floor storage cabinet
    - bathroom floor cabinet
    - floor cabinet
    - storage cabinet
    - storage cupboard
    - wall cabinet
    - linen cabinet
    - freestanding cabinet
  negative_keywords:
    - medicine cabinet
    - mirrored cabinet
    - bathroom mirror cabinet
    - mirror cabinet
    - recessed medicine cabinet
    - wall mounted medicine cabinet
    - wall-mounted medicine cabinet
    - bed frame
    - platform bed
    - bunk bed
    - loft bed
    - artificial tree
    - artificial plant
    - faux tree
    - fake plant
    - wisteria

model_preferences:
  text_copy:
    model: deepseek-v4-flash

required_role_policy:
  counts:
    main: 1
    scene: 1
    size: 1
    func: 1

image_generation:
  statement_measurements:
    item_depth:
      subject: product
      axis: depth
      label: Declared cabinet depth
      source_fields: [Item Depth, Product Depth]
      tuple_fields: [Item Dimensions D x W x H, Product Dimensions, Item Dimensions]
  planning_guidance:
    - "Distinguish the sold cabinet count from source instances and repeated detail views. A sliding door covers only its observed compartment, not every open storage area."
    - "Count physical boards separately from spaces and marketing totals. Adjustable-position ghosts are graphics, not simultaneous shelves; preserve source-visible short feet and pads without rebuilding longer legs."
    - "Keep current mounting contact/separation, panel material and compartment load scope. Match floor, wall or over-toilet use to this child's evidence; towels or baskets named in sales evidence remain owned instances."
  main_image_policy: white_background
  template_image_role_order: [main, scene, func, size]
  structure_invariants:
    - cabinet carcass and top geometry
    - doors, hinges, and handles
    - drawers and drawer fronts when present
    - shelves and interior compartments
    - legs, base, and mounting form
  allowed_internal_props:
    - neatly arranged toiletries inside open shelves or compartments
    - folded towels inside visible storage
  replaceable_staging:
    - target_id: room.wall
      physical_scope: Non-sold room wall surfaces
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: room.floor
      physical_scope: Non-sold room floor or rug surfaces
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: bath.towels
      physical_scope: Loose towels not sold with the cabinet
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: bath.toiletries
      physical_scope: Loose toiletries not sold with the cabinet
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: decor.loose_props
      physical_scope: Independent non-sold flowers, baskets and wall or floor decor
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
  forbidden_additions: []
  visual_context:
    primary_setting: modern US bathroom or powder room
    buyer: homeowners and renters organizing daily storage
    user: household members using bathroom storage
    required_cues:
      - towel and toiletry scale
      - vanity-adjacent or bathroom architectural relationship
      - clean surfaces with practical everyday organization
    allowed_alternates:
      - compact powder room
      - transitional bathroom with restrained spa styling
    avoid:
      - bedroom or living-room staging
      - wall-mounted treatment for a freestanding cabinet
      - empty showroom styling with no believable storage use
  role_specific_rules:
    main:
      - Use a white external canvas while allowing reasonable contents inside the cabinet
    scene:
      - Show storage use without hiding doors, drawers, handles, or cabinet proportions
      - Scene props must remain visibly separate from the product and must not imply included accessories
    size:
      - Preserve confirmed cabinet dimensions and dimension endpoints
    func:
      - Show only source-supported doors, drawers, shelves, mounting, or storage features
