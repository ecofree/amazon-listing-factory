    scene: 1
    size: 1
    func: 1

image_generation:
  statement_measurements:
    item_depth:
      subject: product
      axis: depth
      label: Declared cabinet depth
      source_fields: [Item Depth, Product Depth]
      tuple_fields: [Item Dimensions D x W x H, Product Dimensions, Item Dimensions]
  planning_guidance:
    - "A medicine cabinet may have mirror, clear glass or opaque doors. Only an observed mirror surface has an environment reflection; changing that reflection does not change its frame, hinges or door count."
    - "Bind side cubbies, interior shelves and whole-cabinet totals separately. Preserve source-visible fixing plates, handles and metal colors; do not hardcode a historical example's compartment count."
    - "Use observed door swing and surface/recessed mounting, without inventing hidden support or recess depth. Lighting, power and battery facts require evidence; kitchen or entryway use is allowed only when this child supports it."
  main_image_policy: white_background
  template_image_role_order: [main, scene, func, size]
  structure_invariants:
    - cabinet frame and the exact source-visible door or panel faces
    - doors, hinges, and opening orientation
    - shelves and interior compartments
    - mounting form and visible hardware
    - lights or electrical features only when present
  allowed_internal_props:
    - small toiletries inside open shelves or compartments
  replaceable_staging:
    - target_id: room.wall
      physical_scope: Non-sold room wall surfaces
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: room.floor
      physical_scope: Non-sold room floor or rug surfaces
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: bath.towels
      physical_scope: Loose towels not sold with the cabinet
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: bath.toiletries
      physical_scope: Loose toiletries not sold with the cabinet
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
    - target_id: decor.loose_props
      physical_scope: Independent non-sold flowers, containers, countertop props and wall decor
      roles: [main, scene, func, size]
      environment_modes: [designed_environment]
      non_sold_required: true
  forbidden_additions:
    - part: lights
      unless_source_visible: true
    - part: electrical controls
      unless_source_visible: true
  visual_context:
    primary_setting: modern US bathroom, or another room supported by this child's source evidence
    buyer: homeowners and renters organizing compact wall storage
    user: household members using the evidenced wall cabinet
    required_cues:
      - appropriate household scale for the evidenced room and cabinet face
      - believable wall relationship for the source-visible cabinet
      - restrained accessories appropriate to the planned room; mirror and grooming cues only for supported vanity use
    allowed_alternates:
      - compact powder room vanity
      - shared family bathroom with practical storage
      - source-supported kitchen, dining, or entry storage
    avoid:
      - freestanding floor-cabinet treatment
      - room or installation use unsupported by this child's evidence
      - decorative props that hide the mirror, doors, or storage state
  role_specific_rules:
    main:
      - Use a white external canvas and preserve the source-visible frame, door or panel face, hinge, and shelf geometry
    scene:
      - Preserve the source-visible mounting, door or panel face and opening orientation in the planned evidenced setting
    size:
      - Preserve confirmed cabinet dimensions and any source-visible face dimensions
    func:
      - Show only source-supported face, shelf, door, mounting, or lighting features
